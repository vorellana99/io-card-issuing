services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode (sin Zookeeper). Single broker que también actúa como controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: io-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  card-issuer:
    build:
      context: ./card-issuer
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: card-issuer
      KAFKA_GROUP_ID: card-issuer-group
      SQLITE_PATH: /data/card-issuer.sqlite
    volumes:
      - issuer-data:/data

  card-processor:
    build:
      context: ./card-processor
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: card-processor
      KAFKA_GROUP_ID: card-processor-group
      SQLITE_PATH: /data/card-processor.sqlite
      SIMULATED_LATENCY_MIN_MS: 200
      SIMULATED_LATENCY_MAX_MS: 500
      SUCCESS_PROBABILITY: "0.6"
    volumes:
      - processor-data:/data

volumes:
  issuer-data:
  processor-data:
